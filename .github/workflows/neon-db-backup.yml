name: Neon Database Backup to Cloudflare R2

on:
  schedule:
    - cron: '0 0 * * *'    # Runs every day at 00:00 UTC
  workflow_dispatch:       # Allow manual triggers of the workflow

jobs:
  backup:
    runs-on: ubuntu-latest

    # Set environment variables (from secrets and static values)
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto               # 'auto' region for Cloudflare R2&#8203;:contentReference[oaicite:9]{index=9}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}

    steps:
      - name: Checkout repository (optional)
        uses: actions/checkout@v3

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          # Add PostgreSQL Apt repository to get latest client tools
          yes '' | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          sudo apt-get install -y postgresql-client-17

      - name: Set backup timestamp
        run: echo "BACKUP_TS=$(date -u +'%Y-%m-%d_%H-%M-%SZ')" >> $GITHUB_ENV

      - name: Dump Neon database
        run: |
          pg_dump "${NEON_DATABASE_URL}" | gzip > "neon-backup-${BACKUP_TS}.sql.gz"

      - name: Upload to Cloudflare R2
        run: |
          aws s3 cp "neon-backup-${BACKUP_TS}.sql.gz" "s3://${R2_BUCKET_NAME}/neon-backup-${BACKUP_TS}.sql.gz" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --checksum-algorithm CRC32
